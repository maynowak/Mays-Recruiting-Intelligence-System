schemaVersion: "1.0"
agentId: ats-agent
owner: ris-dev
version: "1.0.0"
discovery:
  catalog: ris-dev2-dev-agent-catalog
  visibility: ACTIVE
  apiReachable: true
  executionPath: reader-gate+dispatch+worker
  # Enforced since RIS-AGENT-LIFECYCLE-11: the reader rejects an agent order
  # with 403 before persisting when no valid entitlement exists. The catalog
  # still gates API discovery, not execution.
  blockNewOrdersOnDisable: true
  blockNewOrdersEnforcedBy: lambda/orders_reader.py admission gate
sharedResources:
  - ris-dev2-dev-agent-dispatch
  - ris-dev2-dev-agent-dispatch-dlq
  - ris-dev2-dev-agent-dispatch-ingress
  - ris-dev2-mays-orders-agent-results
  - ris-dev2-mays-orders-agent-results-dlq
  - ris-dev2-mays-orders-agent-result-consumer
  - ris-dev2-dev-agent
  - ris-dev2-dev-orders-reader
  - ris-dev2-dev-work-items
  - ris-dev2-mays-orders
  - ris-dev2-mays-orders-agent-result-hmac
exclusiveResources: []
partnerBindings:
  - type: entitlement
    scope: agent
    managedBy: ris
    deleteOnDetach: true
  - type: api-profile
    scope: shared
    managedBy: ris
    deleteOnDetach: false
  - type: credential
    scope: shared
    managedBy: ris
    deleteOnDetach: false
  - type: partner-application
    scope: shared
    managedBy: ris
    deleteOnDetach: false
  - type: external-ui
    scope: partner
    managedBy: external
    deleteOnDetach: false
    pendingConfirmation: true
uninstall:
  blockNewOrders: true
  inFlight: drain
  catalogVisibility: INACTIVE
  keepHistory: true
  keepSharedResources: true
retention:
  orders: retain
  workItems: retain
  results: retain
  auditLogs: retain
  secret: retain-until-separate-revocation
purge:
  requiresExplicitConfirmation: true
  deletes: [lifecycle-state, agent-specific-history-markers]
  neverDeletes: [orders, workItems, results, sharedResources, secret]
