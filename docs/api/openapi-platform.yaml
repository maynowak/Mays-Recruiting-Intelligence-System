openapi: 3.0.3
info:
  title: Mays-RIS Platform API
  version: "1.0.0"
  description: |
    Canonical machine-readable contract for the Mays-RIS Platform API.

    **Scope.** This document describes the routes that are actually
    reachable through API Gateway `aboqolpm0f` (`mays-ris-dev`, region
    `eu-central-1`, account `240571105849`). Every operation below is
    identity-checked as `(METHOD, PATH)`. A handler branch that has no
    Gateway route is **not** part of this API and does not appear here.

    **Provenance and governance.** Generated from, and continuously
    validated against, three executable sources:

    | Source | File |
    |---|---|
    | Terraform route declarations | `terraform/modules/api/main.tf`, `terraform/modules/orders_reader/main.tf` |
    | Agent dispatcher branches | `lambda/handler.py::_handle_api_event` |
    | Orders-reader dispatcher | `lambda/orders_reader.py` |

    `tests/test_platform_openapi_contract.py` fails if this document drifts
    from any of them. Route identity is `(METHOD, PATH)`: `GET /me/profile`
    never satisfies coverage for `DELETE /me/profile`.

    **OPEN-2 — two error envelopes coexist.** This platform currently
    serves two different error contracts and this document represents both
    rather than pretending they are unified:

    * `ErrorString` — agent / platform Lambda, body is `{"error": "<string>"}`
    * `ErrorObject` — orders-reader Lambda, body is
      `{"error": {"code": ..., "message": ..., "details"?: ...}}`

    Unifying them is an API redesign and is explicitly out of scope. Each
    operation declares which envelope it actually returns.

    **OPEN-3 — infrastructure-governance status is declared per route.**
    Some routes are live but not managed by Terraform. Those are marked
    `x-infrastructure-governance: imperative-open-3` so they cannot be
    mistaken for Terraform-managed. They are reachable today, but
    `terraform apply` does not own them.

    **DELETE /me/profile is profile deletion, not account erasure.** It
    removes exactly one row from `USER_PROFILE_TABLE`. Credentials, API
    profiles, entitlements, work items, job searches and documents are all
    retained. See `x-deletion-scope`.
  contact:
    name: Mays-RIS Platform
servers:
  - url: https://aboqolpm0f.execute-api.eu-central-1.amazonaws.com
    description: mays-ris-dev API Gateway (eu-central-1)

tags:
  - name: Platform
    description: Liveness, platform information, identity context.
  - name: Privacy
    description: Profile deletion and the ordered erasure lifecycle.
  - name: Profile
    description: The authenticated user's own application profile.
  - name: Documents
    description: Short-lived pre-signed access to private user documents.
  - name: Agents
    description: Entitlement-filtered personal agent catalogue.
  - name: APIProfiles
    description: Human-facing API profile management.
  - name: Credentials
    description: Opaque `ris_...` API credentials bound to a profile.
  - name: Introspection
    description: Read-only capability introspection.
  - name: Offers
    description: Offer / product administration and entitlement grants.
  - name: Machine
    description: Machine-to-machine agent execution.
  - name: Partner
    description: Partner agent execution with dual authentication.
  - name: Orders
    description: Order façade served by the orders-reader Lambda.

security:
  - cognitoJwt: []

paths:
  /health:
    get:
      tags: [Platform]
      operationId: getHealth
      summary: Technical liveness probe
      description: |
        Dependency-free liveness check. Performs no DynamoDB, Cognito or SQS
        call, so it stays healthy during a dependency outage. Dependency
        reachability is reported by `GET /platform` instead.
      security: []
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Lambda is running and able to serve.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  /platform:
    get:
      tags: [Platform]
      operationId: getPlatform
      summary: Platform information and dependency reachability
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Platform metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }

  /me:
    get:
      tags: [Platform]
      operationId: getMe
      summary: Authenticated user context derived from the JWT
      description: All fields are read from verified JWT claims.
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Caller identity context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserContext" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }

  /me/profile:
    get:
      tags: [Profile]
      operationId: getProfile
      summary: Read the caller's profile
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: The stored profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
    post:
      tags: [Profile]
      operationId: createProfile
      summary: Provision the caller's profile
      description: |
        Explicit provisioning only — never triggered by a read. Conditional
        write: an existing profile yields 409 and is never overwritten.
        `userId`, `tenantId` and `email` are taken from the JWT; any identity
        field supplied in the body is ignored.
      x-infrastructure-governance: terraform-managed
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileWritable" }
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequestString" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "409":
          description: Profile already exists (conditional write failed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "500": { $ref: "#/components/responses/ServerErrorString" }
    patch:
      tags: [Profile]
      operationId: patchProfile
      summary: Patch the caller's profile with optimistic concurrency
      x-infrastructure-governance: imperative-open-3
      x-infrastructure-note: Live handler route; not declared in Terraform (OPEN-3).
      description: >-
        Partial update of nickname, firstName and lastName. Supply
        expectedVersion in the body or the exact version in If-Match. A stale
        version returns 409; identity, tenant, email, status and roles are
        server-owned.
      parameters:
        - name: If-Match
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfilePatchV1" }
      responses:
        "200":
          description: Updated canonical UserProfileV1.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400": { $ref: "#/components/responses/BadRequestString" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "403":
          description: Tenant context is missing or conflicts with the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
        "409":
          description: The supplied profile version is stale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "428":
          description: Optimistic-lock token required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
    put:
      tags: [Profile]
      operationId: updateProfile
      summary: Update the caller's profile (legacy method alias)
      description: |
        v1 fields only. `userId`, `tenantId` and `createdAt` are immutable.
        No upsert: a missing profile yields 404.
      x-infrastructure-governance: terraform-managed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserProfileWritable" }
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400":
          description: No updatable v1 field supplied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "403":
          description: Tenant context is missing or conflicts with the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
        "409":
          description: The supplied profile version is stale.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "428":
          description: Optimistic-lock token required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "500": { $ref: "#/components/responses/ServerErrorString" }
    delete:
      tags: [Profile]
      operationId: deleteProfile
      summary: Delete the caller's profile row (profile deletion only)
      description: |
        **This is profile deletion, not account deletion.**

        Removes exactly one item from `USER_PROFILE_TABLE`, keyed by the
        authenticated JWT subject. The request body is never consulted, so a
        caller cannot target another user. Deletion is conditional on the
        row existing, which makes the 404 race-free.

        Not affected by this operation — all retained:

        * API profiles and their credentials (the caller's machine access surface)
        * entitlements
        * work items, agent runs, events
        * job searches
        * documents

        Those stores are governed separately; this endpoint does not claim
        to erase them.
      x-infrastructure-governance: terraform-managed
      x-deletion-scope: USER_PROFILE_TABLE-row-only
      x-is-account-erasure: false
      responses:
        "204":
          description: Profile deleted. Empty body.
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404":
          description: No profile exists for the authenticated subject.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }
        "500": { $ref: "#/components/responses/ServerErrorString" }

  /me/erasure:
    post:
      tags: [Privacy]
      operationId: eraseMyData
      summary: Run the privacy erasure lifecycle for the authenticated caller
      description: |
        **Distinct from `DELETE /me/profile`**, which deletes one
        application-profile row and nothing else. This is the only
        operation that revokes the caller's machine access.

        Ordered lifecycle. Credentials are revoked FIRST, so a successful
        run cannot leave a usable `ris_...` credential behind regardless of
        what happens to the later steps:

        1. revoke all machine credentials owned by the caller
        2. revoke all API profiles owned by the caller
        3. cancel the caller's non-terminal work (QUEUED / RUNNING / RETRY /
           CREATED); terminal work is **retained**, never deleted, because
           deleting it would re-admit duplicate execution
        4. delete document objects the platform holds for the caller
        5. delete the caller profile row

        Entitlements and orders are untouched: entitlements carry no
        capability once credentials are revoked and already self-expire via
        TTL, and orders are owned by Mays-Orders.

        Scope is always the authenticated caller — there is no user or
        tenant parameter, so a caller cannot target anyone else.

        Idempotent: re-running revokes only what is not already REVOKED and
        cancels only work that is still non-terminal.

        `POST` rather than `DELETE`: this is an ordered, retryable lifecycle,
        not an idempotent single-resource delete.
      x-infrastructure-governance: terraform-managed
      x-deletion-scope: ordered-lifecycle-credentials-first
      x-is-account-erasure: true
      x-terminal-work-retained: true
      responses:
        "200":
          description: Every lifecycle step succeeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErasureResult" }
        "207":
          description: |
            Partial execution. At least one step failed, so erasure is NOT
            complete. Check `complete` and the per-step `ok` flags before
            assuming anything was removed. In particular, if
            `revoke-credentials` failed, a live credential may still exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErasureResult" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "500": { $ref: "#/components/responses/ServerErrorString" }
        "503":
          description: A backing store was not configured or unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }

  /me/documents:
    post:
      tags: [Documents]
      operationId: createDocumentUpload
      summary: Issue a short-lived pre-signed upload URL
      x-infrastructure-governance: imperative-open-3
      x-infrastructure-note: >-
        Live and reachable, but declared in no .tf file. `terraform apply`
        does not manage this route (OPEN-3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName: { type: string }
                contentType: { type: string }
      responses:
        "200":
          description: Pre-signed upload target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentUploadTicket" }
        "400": { $ref: "#/components/responses/BadRequestString" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "500": { $ref: "#/components/responses/ServerErrorString" }

  /me/documents/{docId}:
    parameters:
      - $ref: "#/components/parameters/DocId"
    get:
      tags: [Documents]
      operationId: getDocumentDownload
      summary: Issue a short-lived pre-signed download URL
      x-infrastructure-governance: imperative-open-3
      x-infrastructure-note: Live, but not managed by Terraform (OPEN-3).
      responses:
        "200":
          description: Pre-signed download target.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentDownloadTicket" }
        "400": { $ref: "#/components/responses/BadRequestString" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
        "500": { $ref: "#/components/responses/ServerErrorString" }
    delete:
      tags: [Documents]
      operationId: deleteDocument
      summary: Delete a user document
      x-infrastructure-governance: imperative-open-3
      x-infrastructure-note: Live, but not managed by Terraform (OPEN-3).
      responses:
        "200":
          description: Deletion acknowledgement.
          content:
            application/json:
               schema:
                 type: object
                 required: [deleted, documentId]
                 properties:
                   deleted: { type: boolean }
                   documentId: { type: string }
        "400": { $ref: "#/components/responses/BadRequestString" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
        "500": { $ref: "#/components/responses/ServerErrorString" }

  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: Agent catalogue filtered by the caller's entitlements
      description: |
        Only agents with `status` ACTIVE and a currently valid entitlement
        for the caller are returned. Entitlement window validation is
        delegated to `agents.ecosystem.worker_authorization.is_entitlement_valid`,
        the same function the worker uses before execution, so ingress and
        execution cannot disagree.
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Allowed agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: "#/components/schemas/Agent" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }

  /v1/introspection:
    get:
      tags: [Introspection]
      operationId: getIntrospection
      summary: Read-only capability introspection for a credential
      description: |
        Requires a Cognito JWT **and** an `X-Api-Credential` header. Reports
        what the supplied credential is permitted to do; performs no state
        change.
      parameters:
        - $ref: "#/components/parameters/ApiCredential"
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Capability report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntrospectionResponse" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
        "503":
          description: A backing store was unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorString" }

  /v1/apiprofiles:
    get:
      tags: [APIProfiles]
      operationId: listApiProfiles
      summary: List the caller's API profiles
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Profiles owned by the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ApiProfile" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
    post:
      tags: [APIProfiles]
      operationId: createApiProfile
      summary: Create an API profile
      x-infrastructure-governance: terraform-managed
      responses:
        "201":
          description: Profile created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiProfile" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}:
    parameters:
      - $ref: "#/components/parameters/ApiProfileId"
    get:
      tags: [APIProfiles]
      operationId: getApiProfile
      summary: Read one API profile
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiProfile" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
    patch:
      tags: [APIProfiles]
      operationId: updateApiProfile
      summary: Update an API profile
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiProfile" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}/status:
    parameters:
      - $ref: "#/components/parameters/ApiProfileId"
    post:
      tags: [APIProfiles]
      operationId: setApiProfileStatus
      summary: Drive the API profile lifecycle
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: New lifecycle state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiProfile" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}/credentials:
    parameters:
      - $ref: "#/components/parameters/ApiProfileId"
    get:
      tags: [Credentials]
      operationId: listCredentials
      summary: List credentials bound to an API profile
      description: Credential secrets are never returned, only metadata.
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Credential metadata list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
    post:
      tags: [Credentials]
      operationId: issueCredential
      summary: Issue a new opaque `ris_...` credential
      description: The secret is returned exactly once, at creation.
      x-infrastructure-governance: terraform-managed
      responses:
        "201":
          description: Credential created; the secret appears only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialIssued" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/ApiProfileId"
      - $ref: "#/components/parameters/CredentialId"
    get:
      tags: [Credentials]
      operationId: getCredential
      summary: Read credential metadata
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Credential metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}/credentials/{credentialId}/enable:
    parameters: [{ $ref: "#/components/parameters/CredentialAction" }]
    post:
      tags: [Credentials]
      operationId: enableCredential
      summary: Enable a disabled credential
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Credential enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}/credentials/{credentialId}/disable:
    parameters: [{ $ref: "#/components/parameters/CredentialAction" }]
    post:
      tags: [Credentials]
      operationId: disableCredential
      summary: Disable a credential without revoking it
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Credential disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}/credentials/{credentialId}/revoke:
    parameters: [{ $ref: "#/components/parameters/CredentialAction" }]
    post:
      tags: [Credentials]
      operationId: revokeCredential
      summary: Permanently revoke a credential
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Credential revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credential" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/apiprofiles/{apiProfileId}/credentials/{credentialId}/rotate:
    parameters: [{ $ref: "#/components/parameters/CredentialAction" }]
    post:
      tags: [Credentials]
      operationId: rotateCredential
      summary: Rotate a credential secret
      description: The new secret is returned exactly once, at rotation.
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Rotated credential including the new secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialIssued" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/offers:
    get:
      tags: [Offers]
      operationId: listOffers
      summary: List offers visible to the caller
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Offers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  offers:
                    type: array
                    items: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
    post:
      tags: [Offers]
      operationId: createOffer
      summary: Create an offer
      x-infrastructure-governance: terraform-managed
      responses:
        "201":
          description: Offer created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

  /v1/offers/{offerId}:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    get:
      tags: [Offers]
      operationId: getOffer
      summary: Read one offer
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }
    patch:
      tags: [Offers]
      operationId: updateOffer
      summary: Update offer attributes
      x-infrastructure-governance: terraform-managed
      responses:
        "200":
          description: Updated offer.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

