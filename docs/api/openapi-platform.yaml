components:
  securitySchemes:
    cognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Amazon Cognito user pool JWT, validated by API Gateway HTTP API before
        the Lambda is invoked. `sub` is the authenticated subject;
        `custom:tenant_id` carries tenant isolation.

  parameters:
    DocId:
      name: docId
      in: path
      required: true
      schema: { type: string }
    ApiProfileId:
      name: apiProfileId
      in: path
      required: true
      schema: { type: string }
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema: { type: string }
    CredentialAction:
      name: credentialId
      in: path
      required: true
      schema: { type: string }
    OfferId:
      name: offerId
      in: path
      required: true
      schema: { type: string }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    ApiCredential:
      name: X-Api-Credential
      in: header
      required: true
      description: >-
        Opaque `ris_...` product credential. Deliberately separate from
        `Authorization`, which the gateway uses for the Cognito JWT, so the
        two boundaries stay unambiguous: Cognito answers "authenticated?",
        this answers "which product context?". Never logged.
      schema: { type: string }

  responses:
    UnauthorizedString:
      description: No valid Cognito JWT was presented (gateway-rejected or absent).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorString" }
    BadRequestString:
      description: Request body or parameters are invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorString" }
    NotFoundString:
      description: Resource does not exist for this caller.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorString" }
    ServerErrorString:
      description: Unexpected server-side failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorString" }

  schemas:
    # --- OPEN-2 error envelopes: BOTH are real and coexist ---------------
    ErrorString:
      type: object
      title: ErrorString (agent / platform envelope)
      description: >-
        Error body returned by the agent and platform Lambdas. The `error`
        member is a plain string. 77 occurrences in lambda/handler.py.
      required: [error]
      properties:
        error: { type: string }

    ErrorObject:
      type: object
      title: ErrorObject (orders-reader envelope)
      description: >-
        Error body returned by the orders-reader Lambda. The `error` member
        is an object with a stable machine-readable `code`. Distinct from
        `ErrorString`; unifying them is deferred as OPEN-2.
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, additionalProperties: true }

    # --- domain objects -------------------------------------------------
    HealthResponse:
      type: object
      required: [status, service, version, environment]
      properties:
        status: { type: string, example: ok }
        service: { type: string }
        version: { type: string }
        environment: { type: string }

    PlatformResponse:
      type: object
      required: [platform]
      properties:
        platform:
          type: object
          required: [name, version, environment]
          properties:
            name: { type: string }
            version: { type: string }
            environment: { type: string }

    UserContext:
      type: object
      required: [userId, tenantId, groups]
      description: Identity context derived solely from verified JWT claims.
      properties:
        userId: { type: string }
        email: { type: string, nullable: true }
        tenantId: { type: string, nullable: true }
        groups:
          type: array
          items: { type: string }

    UserProfile:
      type: object
      description: >-
        Canonical Jobsearch UserProfileV1. `userId`, `tenantId` and `email`
        originate from verified server context, never from the request body.
      additionalProperties: false
      required: [schemaVersion, userId, tenantId, status, createdAt, updatedAt, version]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        userId: { type: string }
        tenantId: { type: string }
        nickname: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        status: { type: string, enum: [active, disabled, pending] }
        createdAt: { type: string }
        updatedAt: { type: string }
        version: { type: integer, minimum: 1 }

    UserProfileWritable:
      type: object
      description: >-
        Only the three mutable v1 fields. Identity and audit fields are
        server-owned and rejected. PATCH requires expectedVersion or If-Match.
      additionalProperties: false
      properties:
        nickname: { type: string, nullable: true }
        firstName: { type: string, nullable: true }
        lastName: { type: string, nullable: true }
        expectedVersion: { type: integer, minimum: 1 }

    UserProfilePatchV1:
      allOf:
        - $ref: "#/components/schemas/UserProfileWritable"

    DocumentUploadTicket:
      type: object
      description: Short-lived pre-signed upload authorisation.
      additionalProperties: false
      required: [documentId, uploadUrl, expiresAt, requiredHeaders]
      properties:
        uploadUrl: { type: string }
        documentId: { type: string }
        expiresAt: { type: string, format: date-time }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }

    DocumentDownloadTicket:
      type: object
      description: Short-lived pre-signed download authorisation.
      additionalProperties: false
      required: [documentId, downloadUrl, expiresAt]
      properties:
        downloadUrl: { type: string }
        documentId: { type: string }
        expiresAt: { type: string, format: date-time }

    Agent:
      type: object
      description: >-
        Catalogue entry as returned by `GET /agents`, i.e. filtered by
        entitlement. Only ACTIVE agents appear.
      properties:
        agentId: { type: string }
        name: { type: string }
        version: { type: string }
        capabilities:
          type: array
          items: { type: string }
        status: { type: string }

    ApiProfile:
      type: object
      properties:
        apiProfileId: { type: string }
        userId: { type: string }
        name: { type: string }
        status: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    Credential:
      type: object
      description: Credential metadata. Never contains the secret.
      properties:
        credentialId: { type: string }
        apiProfileId: { type: string }
        status: { type: string }
        createdAt: { type: string }
        rotatedAt: { type: string, nullable: true }

    CredentialIssued:
      type: object
      description: >-
        Credential metadata plus the secret, returned exactly once at
        creation or rotation and never retrievable afterwards.
      properties:
        credentialId: { type: string }
        apiProfileId: { type: string }
        status: { type: string }
        secret:
          type: string
          writeOnly: true
          description: Opaque `ris_...` value. Shown once.

    IntrospectionResponse:
      type: object
      properties:
        credentialId: { type: string }
        apiProfileId: { type: string }
        capabilities:
          type: array
          items: { type: string }

    Offer:
      type: object
      properties:
        offerId: { type: string }
        status: { type: string }
        validFrom: { type: string }
        validUntil: { type: string }
        createdAt: { type: string }

    GrantResult:
      type: object
      properties:
        granted:
          type: boolean
        entitlementId: { type: string, nullable: true }
        userId: { type: string }
        agentId: { type: string }
        validFrom: { type: string }
        validUntil: { type: string }

    SearchConfigurationV1:
      type: object
      description: >-
        Canonical Jobsearch SearchConfigurationV1. `skills` is a phrase-
        preserving string (quoted phrases must not be split); `radiusKm` is
        nullable and restricted to the product values.
      additionalProperties: false
      required: [skills, targetRoles, city, radiusKm, workModes, employmentTypes]
      properties:
        skills: { type: string, maxLength: 4000 }
        targetRoles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        city: { type: string, maxLength: 200 }
        radiusKm:
          type: integer
          nullable: true
          enum: [10, 25, 50, 100]
        workModes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [remote, hybrid, onsite] }
        employmentTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [full_time, part_time] }

    MatchingPreferencesV1:
      type: object
      description: Canonical Jobsearch MatchingPreferencesV1 (three phrase lists).
      additionalProperties: false
      required: [requiredSkills, preferredSkills, excludedTerms]
      properties:
        requiredSkills:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        preferredSkills:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        excludedTerms:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }

    ManualSearchProfileInput:
      type: object
      description: >-
        Client-supplied v1 fields. Identity (userId, tenantId, partner, issuer)
        and schemaVersion/version are server-owned and rejected in the body.
        On update a missing searchConfig or matchingPreferences is preserved.
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        searchConfig:
          $ref: "#/components/schemas/SearchConfigurationV1"
        matchingPreferences:
          $ref: "#/components/schemas/MatchingPreferencesV1"
        version: { type: integer, minimum: 1, description: "Optimistic-lock version for updates." }

    ManualSearchProfileV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, manualSearchProfileId, name, origin, searchConfig, matchingPreferences, createdAt, updatedAt, version]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        manualSearchProfileId: { type: string }
        name: { type: string }
        description: { type: string }
        origin: { type: string, enum: [manual] }
        searchConfig:
          $ref: "#/components/schemas/SearchConfigurationV1"
        matchingPreferences:
          $ref: "#/components/schemas/MatchingPreferencesV1"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    PartnerCvInput:
      type: object
      additionalProperties: false
      oneOf:
        - required: [name]
        - required: [filename]
      properties:
        name: { type: string }
        filename: { type: string, description: Canonical alias for legacy name. }
        contentType: { type: string }
        version: { type: integer, minimum: 1, description: "Optimistic-lock version for PATCH." }
        metadata:
          type: object
          additionalProperties: false
          properties:
            pageCount: { type: integer, minimum: 1 }
            language: { type: string }

    PartnerCvV1:
      type: object
      description: Canonical Jobsearch CVDocumentV1. Legacy RIS names are not emitted.
      additionalProperties: false
      required: [schemaVersion, cvId, filename, processingStatus, createdAt, updatedAt, version]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        cvId: { type: string }
        documentId: { type: string, description: Server-assigned document id; never an S3 key. }
        filename: { type: string }
        contentType: { type: string, enum: [application/pdf] }
        sizeBytes: { type: integer, minimum: 1, description: Present only after verified HeadObject. }
        processingStatus:
          type: string
          enum: [pending, ready, failed, deleted]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        metadata:
          type: object
          additionalProperties: false
          properties:
            pageCount: { type: integer, minimum: 1 }
            language: { type: string }

    PartnerCvUploadTicket:
      type: object
      required: [cvId, documentId, uploadUrl, expiresAt, requiredHeaders]
      properties:
        cvId: { type: string }
        documentId: { type: string }
        uploadUrl:
          type: string
          description: Short-lived presigned PUT URL; never persisted.
        expiresAt: { type: string, format: date-time }
        requiredHeaders:
          type: object
          additionalProperties: { type: string }

    PartnerCvDownload:
      type: object
      required: [cvId, documentId, downloadUrl, expiresAt]
      properties:
        cvId: { type: string }
        documentId: { type: string }
        downloadUrl:
          type: string
          description: Short-lived presigned GET URL; never persisted.
        expiresAt: { type: string, format: date-time }

    PartnerCvDeleteResult:
      type: object
      properties:
        cvId: { type: string }
        deleted: { type: boolean }
        physicalPurge:
          type: boolean
          description: Always false; versioned delete creates a delete marker.
        document:
          type: object
          properties:
            existed: { type: boolean }
            deleted: { type: boolean }
            deleteMarker: { type: boolean }
            physicalPurge: { type: boolean }
            versionId: { type: string, nullable: true }

    CVSearchProfileInput:
      type: object
      description: >-
        Client-supplied CV search profile fields. IDs, parent cvId, identity,
        origin, timestamps and schemaVersion are server-owned.
      additionalProperties: false
      required: [name, searchConfig]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        searchConfig:
          $ref: "#/components/schemas/SearchConfigurationV1"
        version: { type: integer, minimum: 1, description: "Optimistic-lock version for updates." }

    CVSearchProfileV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, searchProfileId, cvId, name, origin, searchConfig, createdAt, updatedAt, version]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        searchProfileId: { type: string }
        cvId: { type: string }
        name: { type: string }
        description: { type: string }
        origin: { type: string, enum: [cv] }
        searchConfig:
          $ref: "#/components/schemas/SearchConfigurationV1"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    ATSCriteriaV1:
      type: object
      additionalProperties: false
      required: [schemaVersion]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        requiredSkills:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        preferredSkills:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        excludedTerms:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }

    ATSProfileInput:
      type: object
      additionalProperties: false
      required: [name, targetRoles, skills]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        targetRoles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        skills:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        criteria:
          $ref: "#/components/schemas/ATSCriteriaV1"
        version: { type: integer, minimum: 1, description: "Optimistic-lock version for updates." }

    ATSSearchProfileV1:
      type: object
      additionalProperties: false
      required: [schemaVersion, atsSearchProfileId, searchProfileId, name, targetRoles, skills, createdAt, updatedAt, version]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        atsSearchProfileId: { type: string }
        searchProfileId: { type: string }
        name: { type: string }
        targetRoles:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        skills:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        criteria:
          $ref: "#/components/schemas/ATSCriteriaV1"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }

    WorkAccepted:
      type: object
      description: >-
        The `workId` identifies the registered work item. Duplicate
        submission of a completed workId does not start a second run.
      required: [workId, status]
      properties:
        workId: { type: string }
        status: { type: string, example: QUEUED }

    ErasureStepResult:
      type: object
      description: >-
        One lifecycle step. A false `ok` means that step did NOT complete.
      required: [step, ok, affected]
      properties:
        step:
          type: string
          enum:
            - revoke-credentials
            - revoke-api-profiles
            - cancel-non-terminal-work
            - delete-documents
            - delete-user-profile
        ok: { type: boolean }
        affected: { type: integer }
        error:
          type: string
          nullable: true
          description: Present only when `ok` is false.

    ErasureResult:
      type: object
      description: |
        Ordered erasure outcome. `complete` is the honest field: it is true
        only when every step succeeded, so a partial run can never be
        mistaken for a finished erasure.
      required: [userId, complete, credentialsRevoked, profilesRevoked,
                 workCancelled, documentsDeleted, profileDeleted, steps]
      properties:
        userId: { type: string }
        tenantId: { type: string, nullable: true }
        complete: { type: boolean }
        credentialsRevoked: { type: integer }
        profilesRevoked: { type: integer }
        workCancelled:
          type: integer
          description: Non-terminal work moved to CANCELLED. Terminal work is retained.
        documentsDeleted: { type: integer }
        profileDeleted: { type: boolean }
        steps:
          type: array
          items: { $ref: "#/components/schemas/ErasureStepResult" }

    Order:
      type: object
      description: >-
        Order as served by the orders-reader Lambda. Internal persistence
        fields (`pk`, `sk`, `gsi1pk`, `gsi1sk`, `version`, `isTestData`) are
        stripped before serialisation and are deliberately absent here.
      properties:
        orderId: { type: string }
        status:
          type: string
          enum: [PENDING, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED]
        data: { type: object, additionalProperties: true }
        createdAt: { type: string }
        updatedAt: { type: string }
