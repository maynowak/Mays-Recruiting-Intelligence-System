  /v1/offers/{offerId}/grant:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      tags: [Offers]
      operationId: grantOffer
      summary: Grant an entitlement produced by an offer
      description: |
        `validFrom` and `validUntil` are required and must be parseable; the
        domain refuses a grant without a window. Client-supplied timestamps
        are accepted in either naive or offset-bearing ISO form, and both
        are honoured by the same validation function the worker uses.
      x-infrastructure-governance: terraform-managed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, tenantId, reason, validFrom, validUntil]
              properties:
                userId: { type: string }
                tenantId: { type: string }
                reason: { type: string }
                validFrom: { type: string }
                validUntil: { type: string }
      responses:
        "200":
          description: Grant result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrantResult" }
        "400": { $ref: "#/components/responses/BadRequestString" }
        "401": { $ref: "#/components/responses/UnauthorizedString" }
        "404": { $ref: "#/components/responses/NotFoundString" }

