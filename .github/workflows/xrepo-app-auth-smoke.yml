name: XRepo App Auth Smoke Test

on:
  push:
    branches:
      - test/xrepo-app-auth-smoke-01

permissions:
  contents: read

jobs:
  verify-app-auth:
    name: Verify GitHub App installation token and permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create installation token for both repositories
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.XREPO_APP_ID }}
          private-key: ${{ secrets.XREPO_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: "mays-jobsearch,Mays-Recruiting-Intelligence-System"
          permission-contents: write
          permission-issues: read

      - name: Verify installation repositories
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          repos="$(gh api /installation/repositories --jq '[.repositories[].full_name] | sort | join(",")')"
          echo "installation repositories: ${repos}"
          test "${repos}" = "maynowak/Mays-Recruiting-Intelligence-System,maynowak/mays-jobsearch"

      - name: Verify issues read and repository access
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          for repo in \
            maynowak/mays-jobsearch \
            maynowak/Mays-Recruiting-Intelligence-System; do
            gh api "repos/${repo}/issues?per_page=1" --jq 'length' >/dev/null
            echo "issues read PASS: ${repo}"
          done

      - name: Verify contents read
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          for repo in \
            maynowak/mays-jobsearch \
            maynowak/Mays-Recruiting-Intelligence-System; do
            gh api "repos/${repo}/contents/.github/workflows" --jq 'length' >/dev/null
            echo "contents read PASS: ${repo}"
          done

      - name: Record permission proof
        run: |
          echo "Token creation succeeded with requested Contents: write and Issues: read."
          echo "GitHub rejects installation-token requests for permissions the installation does not grant."
          echo "No write operation was performed by this smoke test."
          echo "App token and private key were not printed."
