name: Ground Zero CI

# Read-only static checks only.
#
# Deployment is intentionally NOT automated here. The approved path is the
# installer saved-plan workflow (package -> plan -> reviewed apply) with an
# explicit AWS-operation gate; see AGENTS.md. This workflow never plans or
# applies against AWS and uses no AWS credentials.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache

jobs:
  terraform-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.6, < 2.0"
          terraform_wrapper: false

      - name: Prepare plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Terraform Format
        run: terraform fmt -check -recursive

      # The generated Mays-Orders module is gitignored and rebuilt by the
      # installer builder from pinned sources. Validate every committed,
      # self-contained module here; never fabricate the generated module.
      - name: Terraform Validate Modules
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            dir="${dir%/}"
            if [ "$dir" = "modules/mays_orders" ]; then
              echo "::notice::Skipping generated module $dir (installer builder owns it)."
              continue
            fi
            echo "::group::terraform validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      # Root validation needs the generated module. Run it only when a local
      # builder checkout provides it; a clean CI checkout skips it explicitly.
      - name: Terraform Validate Root
        run: |
          set -euo pipefail
          if [ -f modules/mays_orders/main.tf ]; then
            terraform init -backend=false -input=false -no-color
            terraform validate -no-color
          else
            echo "::notice::Generated modules/mays_orders is absent (gitignored); root validate skipped."
          fi
