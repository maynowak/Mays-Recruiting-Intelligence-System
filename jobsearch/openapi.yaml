openapi: 3.1.0
info:
  title: JobSearch API
  description: Standard API for searching job listings across multiple sources
  version: 1.0.0

servers:
  - url: http://localhost:8000

tags:
  - name: jobs
    description: Job search and retrieval operations

paths:
  /v1/jobs/search:
    post:
      tags:
        - jobs
      summary: Search for jobs
      operationId: searchJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: Successful search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/jobs/{jobId}:
    get:
      tags:
        - jobs
      summary: Get job by ID
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  /v1/sources:
    get:
      tags:
        - jobs
      summary: List available sources
      operationId: listSources
      responses:
        '200':
          description: Sources list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SourceInfo'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    SearchRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
        location:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 50

    SearchResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total:
          type: integer

    Job:
      type: object
      required:
        - id
        - title
        - company
        - location
        - url
        - source
        - sourceJobId
      properties:
        id:
          type: string
        sourceJobId:
          type: string
        source:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        url:
          type: string
        description:
          type: string

    SourceInfo:
      type: object
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: object

security:
  - ApiKeyAuth: []
